# ─── IDENTIDAD VISUAL — fuente ÚNICA de verdad ────────────────────────────────
# Antes la marca vivía en dos sitios que se contradecían: laughloud-design-style/SKILL.md
# pedía oscuro-premium-minimal y los prompts hardcodeados pedían pasteles retro decorativos.
# Ahora los prompts de arte (prompt-templates.ts) Y la tipografía vectorial
# (type-director.ts) leen de aquí. Cambiar el look = cambiar este bloque, nada más.
# Para volver al look retro-decorativo anterior basta reescribir `aesthetic` y `palette`.
brand:
  aesthetic: >-
    dark, premium and intentional; restrained composition where every element earns its
    place; generous negative space; clever rather than loud
  avoid: [rainbow, oversaturated, busy pattern, clip art, generic template]
  # Tintas y acentos. La tipografía elige de aquí y valida contraste contra la prenda.
  palette: ["#0D0D0D", "#EDEDED", "#C9A96E", "#D4B87A", "#888888", "#F5F0E8"]
  fonts: [anton, alfa-slab, bebas, pacifico, abril, lato]
  max_typefaces: 2            # regla dura de la guía de estilo

market:
  country: "US"               # ISO 3166-1 alpha-2 — used by Apify, Trends, validator
  currency: "USD"             # ISO 4217 — expected currency in Apify listings
  language: "en"              # ISO 639-1 — expected listing language
  audience: "US Etsy buyers"  # free text injected into validator's system prompt

research:
  # When auto_discover=true, the pipeline ignores keywords_seed and instead pulls
  # current trending searches in the configured market via Google Trends, filters
  # them through Gemini for POD-relevance, and asks the user (CLI + Telegram) to
  # confirm before generating designs. Set to false to use keywords_seed manually.
  # false para este run: la keyword de abajo está validada con datos reales de EverBee
  # (volumen y competencia medidos), no estimada por Gemini. Discovery propone frases
  # plausibles pero es CIEGO al orden de palabras, que es lo que decide el volumen:
  # "pregnant halloween announcement shirt" = 1 búsqueda/mes, "halloween pregnant
  # announcement shirt" = 158. Mismas palabras. Ponlo en true para volver a proponer.
  auto_discover: false
  # Interruptor maestro de TODAS las llamadas de pago a Apify (muestra de Etsy +
  # visibilidad de Pinterest). Apagado: la suscripción está cancelada. El código de
  # Apify sigue intacto y operativo — simplemente no se alcanza. Ponlo en true y vuelve
  # el comportamiento anterior sin tocar nada más.
  # Qué lo sustituye: el volumen y la competencia de la keyword se miden fuera del
  # pipeline con el MCP de EverBee ANTES de escribirla en keywords_seed. Con esto en
  # false, el gate de demanda se omite (no hay muestra sobre la que juzgar) y la
  # calificación real ya ocurrió aguas arriba.
  use_apify: false
  discovery_window_days: 60       # días de lookahead para el calendario POD (60 = 2 meses, cubre Halloween en Agosto)
  discovery_candidates: 8         # ~2 por evento del calendario; Gemini propone, 0 llamadas Apify
  # Runway mínimo (días) hasta que cierre la ventana de compra de un evento para que valga
  # la pena sembrarlo. Una listing nueva necesita SEMANAS de impresiones antes de rankear.
  # Lección de la tanda de Father's Day: publicada 2026-06-08 para el evento del 2026-06-21
  # (13 días) → nunca rankeó, 1 visita en 2 meses. 0 desactiva el gate.
  min_publish_lead_days: 30
  # 1 sola seed = 1 llamada Apify = el nicho que se procesa. Solo se usa cuando
  # auto_discover=false; con auto_discover=true manda lo que elijas en el gate de discovery.
  # Halloween US (31-oct): ventana de compra abre 19-sep y cierra 28-oct → 83 días de runway
  # desde hoy, de sobra para que una listing nueva acumule impresiones y rankee.
  #
  # Medido en EverBee (2026-08-05), volumen/competencia/score:
  #   funny halloween pregnant announcement shirt    80 /   958 / 80  ← elegida
  #   halloween pregnant announcement shirt         158 / 1.957 / 80
  #   couples halloween pregnant announcement shirt  16 /   207 / 80  (volumen demasiado fino)
  #   dog mom halloween shirt                       200 / 9.276 / 20
  #   teacher halloween shirt                       658 / 40.640 / 20 (inalcanzable con 0 ventas)
  # Elegida por ratio: la mitad de volumen que la #2 pero la mitad de competencia, y "funny"
  # encaja con la marca. Descartada "dog mom halloween comfort colors shirt" (72/1.372/50):
  # Comfort Colors es una marca de prenda concreta y aquí se imprime Bella+Canvas.
  #
  # Antes de cambiar esta keyword, medí la candidata en EverBee. El orden de palabras cambia
  # el volumen en dos órdenes de magnitud y ni Gemini ni Apify lo detectan.
  keywords_seed:
    - "funny halloween pregnant announcement shirt"
  max_niches: 1          # calidad > cantidad: 1 nicho × 5 diseños × 3 variaciones = 15 artworks únicos
  # Gates de calificación (ambos 0-10) — un nicho debe pasar LOS DOS para llegar a generación.
  min_demand_score: 7        # alta demanda (estimación Gemini)
  # Visibilidad social (Pinterest). Solo se aplica cuando HAY dato de Pinterest;
  # si el actor falla o no hay token, no bloquea (fallback). Solo nichos con alta
  # demanda Y alta visibilidad llegan a generación.
  min_visibility_score: 7
  geo: "US"   # Google Trends region code — kept in sync with market.country

generation:
  designs_per_niche: 5
  products:
    - tshirt                  # 1 solo producto en esta fase — validar ventas antes de fan-out
  variations_per_design: 3   # base, dark, no-text — hardcoded in generator
  style_preference: "minimalist, clean vector"
  remove_background: true    # sharp color-key (Windows-safe). Designs must keep a clean white backdrop.
  # FLAG front/back: con true, cada camiseta genera además un diseño de DORSO dedicado
  # (logo/tagline complementario) y el publisher coloca áreas de impresión frente+dorso en
  # un solo producto. Cuesta +1 llamada Gemini por camiseta (duplica el gasto de imágenes).
  # El código de dorso queda intacto y operativo — solo cambia esta flag para reactivarlo.
  # false = solo frente (mitad de llamadas, recomendado para primeras corridas / control de costo).
  tshirt_back_design: false
  # TIPOGRAFÍA VECTORIAL. Con enabled:true el modelo dibuja SOLO la ilustración (y deja
  # el tercio inferior vacío) y las palabras se componen aquí desde un .ttf real, ya a
  # 4500×5400. Dos motivos: (1) Gemini emite 2048px y el resize a medida Printify
  # interpola ×2.2 — las letras llegan blandas a la prensa; compuestas se rasterizan a
  # resolución nativa; (2) desaparecen las letras deformes/mal escritas, que son
  # motivo de auto-rechazo en la guía de estilo. La variación "no-text" no lleva texto
  # compuesto: sigue siendo solo ilustración.
  # box_* debe moverse a la vez que el ART_ONLY_SUFFIX de prompt-templates.ts.
  typography:
    enabled: true
    box_top: 0.62        # inicio de la caja de texto (fracción del alto)
    box_height: 0.30
    side_margin: 0.10
    line_gap: 0.05
    # fuentes y paleta viven en `brand:` — ver arriba del fichero
  # Dedup por perceptual-hash (dHash). Tras generar cada imagen, descarta diseños
  # casi-idénticos a los de los últimos `compare_runs` runs ANTES de validar/publicar:
  # ahorra la llamada al validador (Vision) y evita listings duplicados que Etsy penaliza.
  dedup_phash:
    enabled: true
    max_distance: 5      # distancia Hamming (de 64 bits) para considerar duplicado. Menor = más estricto.
    compare_runs: 3      # cuántos runs (fechas) recientes comparar

validator:
  max_regenerations: 2         # hard cap on auto-regenerations per design (prevents infinite loops)
  approval_threshold: 6.5      # overall score >= → approved
  borderline_threshold: 5.0    # between this and approval → borderline (still pending-review)
  vision_model: "gemini-2.5-flash"  # multimodal model for image evaluation
  enforce_market_fit: true     # cultural fit with `market.audience` is a hard requirement
  # Hybrid review: designs the AI scores >= approval_threshold skip the manual
  # review queue and go straight to approved/ (ready to publish). Only borderline
  # and force-approved designs land in pending-review for human eyes. Set false to
  # send every passing design through manual review (the old, redundant behavior).
  auto_approve_passing: true
  # When the AI rejects a design, regenerate it automatically using the SAME image
  # model + the validator's suggestedImprovements, up to max_regenerations — no
  # per-design prompt. Set false to get the interactive [R]egenerate/[S]kip/[F]orce menu.
  auto_regenerate: true

publishing:
  # Printify shop a publicar. La cuenta tiene varias tiendas; sin esto el pipeline
  # caía en shops[0] ("casephoneshop", custom_integration = NO Etsy). Fijamos la
  # tienda Etsy real para que los drafts propaguen a Etsy. `pnpm tsx -e` o el nuke
  # script listan los ids. 17619612 = "My Etsy Store" (sales_channel=etsy).
  shop_id: 17619612
  margin_percent: 50          # legacy — el pricing real usa target_net_margin (abajo)
  # Pricing por margen NETO: precio = (coste prenda + envío + fee fijo Etsy) / (1 - fee% total - target_net_margin)
  # fee% total = 9.5% Etsy (transacción+pago) + off-site ads (cuando etsy_offsite_ads=true).
  # Verificado contra el profit calculator de Printify. Con tee Monster (~$13.50), free Standard
  # $4.75, off-site ads 12% y 0.16 → $29.99 (~14-23% neto según talla). Mercado POD dad-shirt: $20-30.
  free_shipping: true         # mete el envío en el precio (Etsy rankea mejor los listings con free shipping)
  shipping_cost_usd: 4.29     # free Economy shipping — es lo que está activo en la tienda (verificado 2026-08-05)
  etsy_offsite_ads: true      # publicidad off-site activada → su fee se mete en el precio
  # OJO: la regla de Etsy va al revés de lo que decía este comentario antes.
  # Facturando <$10k/año el fee es 15% y participar es OPCIONAL; a partir de $10k baja a
  # 12% y pasa a ser OBLIGATORIO. Estamos en el tramo de 15% (confirmado en el panel de
  # Printify). Se mantiene activo a propósito: con la tienda sin tráfico, off-site ads es
  # el único canal que pone la listing fuera de Etsy, y sólo cobra si hay venta.
  etsy_offsite_ads_rate: 0.15
  # 0.14, no 0.16. Con envío gratis + 15% de ads, pedir 16% neto empuja el precio a $34.99,
  # por encima del mercado POD ($20-30). Con 0.14 el precio se queda en $29.99 y el margen
  # real es ~14.7% de media (Printify muestra $3.81 en la L cara, $6.47 en la S barata).
  # Sube esto sólo cuando haya ventas que justifiquen probar un precio más alto.
  target_net_margin: 0.14
  max_publish_per_run: 25
  # Cuántas variaciones del MISMO concepto llegan a Etsy. El generador crea 3 tratamientos
  # (base/dark/no-text) por idea; publicar los 3 crea listings casi idénticas que comparten
  # tags y se canibalizan (Etsy rara vez muestra 2 listings de la misma tienda por query).
  # Verificado en LaughLoudDesigns: 14 listings = solo 5 conceptos reales.
  # 1 = solo la variación mejor validada por concepto.
  max_variations_per_concept: 1
  # Límite de subida base64 a Printify (MB). Por encima, la imagen se cuantiza (lossy) para
  # entrar. El límite real del body de Printify ronda 10MB. Subilo si ves cuantización
  # innecesaria; bajalo si ves HTTP 413. El upscaler local elimina la necesidad de cuantizar.
  max_upload_mb: 90
  # Auto-publish each approved design on these extra product types too
  # (the source image is resized to each target's print dimensions on the fly).
  fan_out_products:
    - tshirt                  # sin fan-out a mug/poster en esta fase
  # Etsy personalization. Designs that are personalizable (explicit `personalizable:true`
  # in metadata, or — when auto_detect — inferred from concept/title keywords) are drafted
  # with Etsy's "Personalize" option ON via sales_channel_properties.personalisation, so
  # buyers can submit custom text. Without this, custom-text designs publish unsellable.
  personalization:
    enabled: true
    instructions: "Add the exact name/text you want printed. Message us for special requests."
    buyer_response_limit: 50   # Etsy max chars a buyer can submit (1-1024)
    auto_detect: true          # infer personalizable from concept/title when no explicit flag
  # Selling US-only → use Printify's economy (cheapest) shipping whenever the product is
  # eligible. Enabled per draft right after creation.
  prefer_economy_shipping: true

gemini:
  model_text: "gemini-2.5-flash"
  model_image: "gemini-3.1-flash-image-preview"
  # Native output resolution. Nano Banana 2 (gemini-3.1-flash-image-preview) supports
  # "512" / "1K" / "2K" / "4K" via generationConfig.imageConfig.imageSize.
  # 2K = 2048px (real detail, no interpolation); 4K = 4096px (más tokens/imagen + más lento).
  image_size: "2K"
  max_image_requests_per_minute: 8

# Optional LOCAL AI upscaler (real detail, no API cost, nothing leaves your machine).
# Uses the standalone realesrgan-ncnn-vulkan binary — NO Docker / Python needed.
# Download the Windows build, unzip, set enabled:true, and put the .exe path in .env as
# UPSCALER_BINARY_PATH (kept out of git). Leave binary_path empty here.
upscaler:
  enabled: false
  binary_path: ""                  # leave empty — set UPSCALER_BINARY_PATH in .env instead
  model: "realesrgan-x4plus"       # general; "realesr-animevideov3" rinde mejor en line-art
  scale: 4                         # x4plus upscalea ×4 (2048 → 8192), luego sharp baja al tamaño de impresión

pipeline:
  notify_telegram: true
  auto_publish: false   # always require manual review before publishing

# Guard de presupuesto por run. Rastrea el gasto estimado (imágenes/texto/vision Gemini +
# llamadas Apify) y aborta ANTES de la llamada que pasaría el tope. Costos unitarios = estimados,
# ajustá a tu facturación real. max_usd_per_run: 0 = solo rastrear, nunca abortar.
budget:
  enabled: true
  max_usd_per_run: 10.0
  cost_per_image_usd: 0.04
  cost_per_text_usd: 0.002
  cost_per_vision_usd: 0.01
  cost_per_apify_call_usd: 0.05   # inerte mientras research.use_apify=false

# Feedback loop post-publicación. Las ventas salen de Printify orders (única señal
# de ventas real y programática — la API de Etsy no está disponible). `pnpm stats`
# lee ventas reales, marca ganadores para escalar y perdedores para retirar.
monitor:
  winner_min_units: 3      # >= unidades vendidas → ganador, generar más variaciones / expandir productos
  loser_window_days: 21    # sin ventas pasados estos días desde el draft → bajo rendimiento, considerar retirar

# Retención de assets. Las imágenes de output/ son intermedios regenerables (el arte
# publicado vive en Printify). Cada `pnpm pipeline` poda al inicio dejando solo los últimos
# `keep_runs` runs (un run = una fecha) en output/ y en approved/rejected/pending-review.
# También borra carpetas output/_archive*. Nunca toca output/.draft-index.json.
# Comando manual: `pnpm clean` (dry-run) / `pnpm clean --apply`.
cleanup:
  enabled: true
  keep_runs: 3
