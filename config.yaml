market:
  country: "US"               # ISO 3166-1 alpha-2 — used by Apify, Trends, validator
  currency: "USD"             # ISO 4217 — expected currency in Apify listings
  language: "en"              # ISO 639-1 — expected listing language
  audience: "US Etsy buyers"  # free text injected into validator's system prompt

research:
  # When auto_discover=true, the pipeline ignores keywords_seed and instead pulls
  # current trending searches in the configured market via Google Trends, filters
  # them through Gemini for POD-relevance, and asks the user (CLI + Telegram) to
  # confirm before generating designs. Set to false to use keywords_seed manually.
  auto_discover: false
  discovery_window_days: 7        # 7 = weekly, 30 = monthly, 90 = quarterly
  discovery_candidates: 25        # raw trending searches to pull before filtering
  keywords_seed:
    - "Funny Dad Shirt"
    - "Best Dad Ever Mug"
    - "Class of 2026 Graduate"
    - "Grill Master Dad"
    - "First Father's Day"
    - "Girl Dad Apparel"
    - "Proud Senior Parent"
    - "Memorial Day USA"
    - "Summer Vacation Mode"
    - "Funny Coffee Lover"
    - "Proud Dog Mom"
    - "Fishing Dad T-Shirt"
    - "Dog Dad Gift"
    - "Future Nurse Grad"
    - "Graduation Party Decor"
    - "Patriotic Military Family"
    - "Lake Life Lover"
    - "Beach Trip 2026"
    - "Camping Adventure Shirt"
    - "BBQ Season Fun"
    - "Teacher End of Year"
    - "Plant Mom Gift"
    - "Last Day of School"
    - "Mental Health Matters"
  max_niches: 5
  min_demand_score: 6
  geo: "US"   # Google Trends region code — kept in sync with market.country

generation:
  designs_per_niche: 5
  products:
    - tshirt
    - mug
    - poster
  variations_per_design: 3   # base, dark, no-text — hardcoded in generator
  style_preference: "minimalist, clean vector"
  remove_background: true    # sharp color-key (Windows-safe). Designs must keep a clean white backdrop.

validator:
  max_regenerations: 2         # hard cap on auto-regenerations per design (prevents infinite loops)
  approval_threshold: 6.5      # overall score >= → approved
  borderline_threshold: 5.0    # between this and approval → borderline (still pending-review)
  vision_model: "gemini-2.5-flash"  # multimodal model for image evaluation
  enforce_market_fit: true     # cultural fit with `market.audience` is a hard requirement
  # Hybrid review: designs the AI scores >= approval_threshold skip the manual
  # review queue and go straight to approved/ (ready to publish). Only borderline
  # and force-approved designs land in pending-review for human eyes. Set false to
  # send every passing design through manual review (the old, redundant behavior).
  auto_approve_passing: true
  # When the AI rejects a design, regenerate it automatically using the SAME image
  # model + the validator's suggestedImprovements, up to max_regenerations — no
  # per-design prompt. Set false to get the interactive [R]egenerate/[S]kip/[F]orce menu.
  auto_regenerate: true

publishing:
  margin_percent: 50
  max_publish_per_run: 25
  # Límite de subida base64 a Printify (MB). Por encima, la imagen se cuantiza (lossy) para
  # entrar. El límite real del body de Printify ronda 10MB. Subilo si ves cuantización
  # innecesaria; bajalo si ves HTTP 413. El upscaler local elimina la necesidad de cuantizar.
  max_upload_mb: 90
  # Auto-publish each approved design on these extra product types too
  # (the source image is resized to each target's print dimensions on the fly).
  fan_out_products:
    - tshirt
    - mug
    - poster

gemini:
  model_text: "gemini-2.5-flash"
  model_image: "gemini-3.1-flash-image-preview"
  # Native output resolution. Nano Banana 2 (gemini-3.1-flash-image-preview) supports
  # "512" / "1K" / "2K" / "4K" via generationConfig.imageConfig.imageSize.
  # 2K = 2048px (real detail, no interpolation); 4K = 4096px (más tokens/imagen + más lento).
  image_size: "2K"
  max_image_requests_per_minute: 8

# Optional LOCAL AI upscaler (real detail, no API cost, nothing leaves your machine).
# Uses the standalone realesrgan-ncnn-vulkan binary — NO Docker / Python needed.
# Download the Windows build, unzip, set enabled:true, and put the .exe path in .env as
# UPSCALER_BINARY_PATH (kept out of git). Leave binary_path empty here.
upscaler:
  enabled: false
  binary_path: ""                  # leave empty — set UPSCALER_BINARY_PATH in .env instead
  model: "realesrgan-x4plus"       # general; "realesr-animevideov3" rinde mejor en line-art
  scale: 4                         # x4plus upscalea ×4 (2048 → 8192), luego sharp baja al tamaño de impresión

pipeline:
  notify_telegram: true
  auto_publish: false   # always require manual review before publishing
