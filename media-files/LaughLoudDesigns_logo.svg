<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#D4B87A"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="800" fill="#0D0D0D"/>
  
  <!-- Outer ring -->
  <circle cx="400" cy="370" r="220" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.6"/>
  
  <!-- Laugh icon - stylized smile/laugh mark -->
  <g transform="translate(400, 340)">
    <!-- Two eyes as minimal lines -->
    <line x1="-60" y1="-40" x2="-30" y2="-55" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-30" y1="-55" x2="0" y2="-40" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    
    <line x1="30" y1="-40" x2="60" y2="-55" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="-55" x2="90" y2="-40" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Wide laugh/smile arc -->
    <path d="M -80 10 Q -40 90 15 90 Q 70 90 110 10" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <!-- Brand name -->
  <text x="400" y="640" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="52" font-weight="bold" fill="#EDEDED" letter-spacing="6">LAUGHLOUD</text>
  
  <!-- Sub text -->
  <text x="400" y="690" text-anchor="middle" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="20" fill="#C9A96E" letter-spacing="12" font-weight="300">D E S I G N S</text>
  
  <!-- Subtle decorative lines -->
  <line x1="250" y1="655" x2="340" y2="655" stroke="#C9A96E" stroke-width="0.8" opacity="0.5"/>
  <line x1="460" y1="655" x2="550" y2="655" stroke="#C9A96E" stroke-width="0.8" opacity="0.5"/>
</svg>
